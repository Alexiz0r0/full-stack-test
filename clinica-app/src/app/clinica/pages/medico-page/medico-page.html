@if (showTable()) {
<div class="my-8 flex flex-raw justify-around content-center w-full">
  <app-search-input
    placeholder="Buscar nombre"
    [(query)]="searchTerm"
    (value)="onSearch($event)"
  />
  <button
    type="button"
    class="btn btn-circle btn-secondary"
    (click)="crearBtn()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
    >
      <path
        fill="currentColor"
        d="M12.943 20.93h-1.886a2.39 2.39 0 0 1-2.386-2.386V15.3l-3.215.029a2.39 2.39 0 0 1-2.387-2.386v-1.886A2.39 2.39 0 0 1 5.456 8.67H8.7l-.029-3.214a2.39 2.39 0 0 1 2.386-2.386h1.886a2.39 2.39 0 0 1 2.386 2.386V8.7l3.215-.03a2.39 2.39 0 0 1 2.387 2.387v1.886a2.39 2.39 0 0 1-2.387 2.386H15.3l.028 3.215a2.39 2.39 0 0 1-2.385 2.386M5.456 9.67a1.39 1.39 0 0 0-1.387 1.387v1.886a1.39 1.39 0 0 0 1.387 1.386H8.7a.97.97 0 0 1 .972.971v3.244a1.39 1.39 0 0 0 1.386 1.386h1.886a1.39 1.39 0 0 0 1.386-1.386V15.3a.97.97 0 0 1 .972-.971h3.243a1.39 1.39 0 0 0 1.387-1.386v-1.886a1.39 1.39 0 0 0-1.388-1.387H15.3a.97.97 0 0 1-.972-.97V5.456a1.39 1.39 0 0 0-1.385-1.386h-1.886a1.39 1.39 0 0 0-1.386 1.386V8.7a.97.97 0 0 1-.972.97Z"
      />
    </svg>
  </button>
</div>

<medico-list
  [medicos]="medicos()"
  [errorMessage]="isError()"
  [isEmpty]="medicos().length === 0"
  [isLoading]="isLoading()"
  (confirmarEliminacion)="confirmarEliminacion($event)"
  (medicoSeleccionado)="cargarEdicion($event)"
/>
} @else {
<app-medico-form
  (onCancelar)="cancelar($event)"
  [data]="medicoSeleccionado()"
  (onGuardar)="guardar($event)"
/>
}

<app-toast [message]="toastMessage()" [type]="toastType()" />
