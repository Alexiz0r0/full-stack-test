<dialog #modalElement class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">{{ title() }}</h3>
    <p class="py-4">{{ message() }}</p>

    <div class="modal-action">
      <form method="dialog" class="flex gap-2">
        <button class="btn btn-ghost">Cancelar</button>
      </form>
      <button
        type="button"
        class="btn"
        [ngClass]="btnColor()"
        (click)="confirmar()"
      >
        {{ btnText() }}
      </button>
    </div>
  </div>
</dialog>
